<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Chat 2.0 - Connect, Communicate, Collaborate</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        echat: {
                            bg: '#050b14',
                            sidebar: '#0a121e',
                            card: '#0f1b2d',
                            accent: '#00a3e0',
                            glow: '#00d2ff',
                            darkCard: '#08101a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050b14; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 163, 224, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 163, 224, 0.6); }
        .bg-wave-pattern {
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 163, 224, 0.08) 0%, transparent 60%),
                              linear-gradient(135deg, rgba(5, 11, 20, 0.95) 0%, rgba(10, 18, 30, 0.98) 100%);
        }
        .glow-border { border: 1px solid rgba(0, 163, 224, 0.3); }
        .glow-border:focus-within { border-color: #00d2ff; box-shadow: 0 0 12px rgba(0, 210, 255, 0.4); }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-wave-pattern">

    <!-- LOGIN SCREEN OVERLAY -->
    <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-[#03070d]/90 backdrop-blur-xl p-4">
        <div class="w-full max-w-md bg-[#08101a]/90 glow-border rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center">
            <!-- Brand Header -->
            <div class="flex items-center justify-center space-x-2 mb-2">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-600 to-sky-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-e"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-white">E-Chat <span class="text-xs bg-cyan-500 text-black px-1.5 py-0.5 rounded font-extrabold">2.0</span></h1>
            </div>
            <p class="text-[11px] font-semibold tracking-widest text-cyan-400 uppercase mb-8">Connect • Communicate • Collaborate</p>

            <h2 class="text-2xl font-bold text-white text-left mb-1">Welcome <span class="text-cyan-400">Back</span></h2>
            <p class="text-xs text-slate-400 text-left mb-6">Sign in with your user name, employee ID and password</p>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1.5 block">User name</label>
                    <div class="relative flex items-center glow-border bg-[#050b14] rounded-xl px-3.5 py-2.5">
                        <i class="fa-regular fa-user text-slate-400 text-sm mr-3"></i>
                        <input type="text" id="loginUsername" required value="Muhammad Faizan Abbasi" class="bg-transparent text-sm w-full text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1.5 block">Employee ID</label>
                    <div class="relative flex items-center glow-border bg-[#050b14] rounded-xl px-3.5 py-2.5">
                        <i class="fa-solid fa-id-card text-slate-400 text-sm mr-3"></i>
                        <input type="text" id="loginEmpId" required placeholder="Your employee ID" value="EMP-248929" class="bg-transparent text-sm w-full text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1.5 block">Password</label>
                    <div class="relative flex items-center glow-border bg-[#050b14] rounded-xl px-3.5 py-2.5">
                        <i class="fa-solid fa-lock text-slate-400 text-sm mr-3"></i>
                        <input type="password" id="loginPassword" required value="123456" class="bg-transparent text-sm w-full text-white focus:outline-none">
                        <i class="fa-regular fa-eye text-slate-400 text-sm cursor-pointer hover:text-white"></i>
                    </div>
                </div>

                <button type="submit" class="w-full mt-4 py-3 bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-black font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition flex items-center justify-center space-x-2">
                    <span>Sign in</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- TOP GLOBAL HEADER -->
    <header class="h-14 bg-[#070e17] border-b border-cyan-950/60 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3 w-72">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-sky-400 flex items-center justify-center text-black font-bold text-lg">
                <i class="fa-solid fa-e"></i>
            </div>
            <span class="font-bold text-white text-base tracking-wide">E-Chat</span>
        </div>

        <!-- Global Search Bar -->
        <div class="flex-1 max-w-xl mx-4">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-xs"></i>
                <input type="text" placeholder="Search people, chats and messages" class="w-full pl-9 pr-4 py-1.5 bg-[#0a1424] text-xs text-white rounded-lg border border-cyan-900/40 focus:outline-none focus:border-cyan-500">
            </div>
        </div>

        <!-- Right Profile Status -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <img id="headerAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" class="w-8 h-8 rounded-full object-cover border border-cyan-500/40">
                <div class="text-left hidden sm:block">
                    <p id="headerName" class="text-xs font-bold text-white leading-none">Muhammad Faizan Abbasi</p>
                    <span class="text-[10px] text-slate-400 leading-tight">Office</span>
                </div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-cyan-400 text-sm p-1.5" title="Sign Out">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- MAIN BODY WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFTMOST ICON RAIL -->
        <nav class="w-16 bg-[#040910] border-r border-cyan-950/60 flex flex-col items-center py-4 space-y-6 shrink-0 text-slate-400 text-xs">
            <button class="flex flex-col items-center space-y-1 text-cyan-400 relative">
                <div class="w-10 h-10 rounded-xl bg-cyan-950/80 border border-cyan-500/40 flex items-center justify-center text-cyan-400">
                    <i class="fa-solid fa-comment-dots text-base"></i>
                </div>
                <span class="text-[10px]">Chat</span>
                <span class="absolute -top-1 right-1 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full">2</span>
            </button>

            <button class="flex flex-col items-center space-y-1 hover:text-cyan-400 transition">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px]">Teams</span>
            </button>

            <button class="flex flex-col items-center space-y-1 hover:text-cyan-400 transition">
                <i class="fa-regular fa-file text-base"></i>
                <span class="text-[10px]">Files</span>
            </button>

            <button class="flex flex-col items-center space-y-1 hover:text-cyan-400 transition">
                <i class="fa-regular fa-bookmark text-base"></i>
                <span class="text-[10px]">Saved</span>
            </button>

            <button class="flex flex-col items-center space-y-1 hover:text-cyan-400 transition relative">
                <i class="fa-regular fa-bell text-base"></i>
                <span class="text-[10px]">Activity</span>
                <span class="absolute -top-1 right-1 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full">59</span>
            </button>

            <button class="flex flex-col items-center space-y-1 hover:text-cyan-400 transition">
                <i class="fa-solid fa-book-open text-base"></i>
                <span class="text-[10px]">E-Book</span>
            </button>
        </nav>

        <!-- SECOND SIDEBAR: CHAT INBOX LIST -->
        <aside class="w-80 bg-[#08101a] border-r border-cyan-950/60 flex flex-col shrink-0">
            <!-- Sidebar Header -->
            <div class="p-3 border-b border-cyan-950/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <h2 class="font-bold text-white text-sm">Chat</h2>
                    <span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded-full flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online 120
                    </span>
                </div>
            </div>

            <!-- Filter Search -->
            <div class="p-3 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-filter absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                    <input type="text" id="contactFilter" oninput="filterContacts(this.value)" placeholder="Filter by name" class="w-full pl-8 pr-3 py-1.5 bg-[#050b14] text-xs text-white rounded-lg border border-cyan-900/30 focus:outline-none focus:border-cyan-500">
                </div>

                <!-- Category Sub-Tabs -->
                <div class="flex items-center space-x-1 text-[11px] overflow-x-auto pb-1 text-slate-400">
                    <button class="px-2.5 py-1 rounded-md bg-cyan-600 text-black font-bold">All</button>
                    <button class="px-2.5 py-1 rounded-md hover:bg-cyan-950/40">Unread</button>
                    <button class="px-2.5 py-1 rounded-md hover:bg-cyan-950/40">Pinned</button>
                    <button class="px-2.5 py-1 rounded-md hover:bg-cyan-950/40">Groups</button>
                    <button class="px-2.5 py-1 rounded-md hover:bg-cyan-950/40">People</button>
                </div>
            </div>

            <!-- Contact List Stream -->
            <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-cyan-950/30">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <!-- MAIN CHAT CONVERSATION VIEW -->
        <main class="flex-1 flex flex-col bg-[#050b14]/90 relative">
            
            <!-- Chat Active Header Bar -->
            <header class="h-14 px-6 border-b border-cyan-950/60 flex items-center justify-between bg-[#08101a]/80 backdrop-blur-md">
                <div class="flex items-center space-x-3">
                    <img id="activeTargetAvatar" src="" class="w-9 h-9 rounded-full object-cover ring-1 ring-cyan-500/40">
                    <div>
                        <h3 id="activeTargetName" class="text-sm font-bold text-white leading-tight">Select Contact</h3>
                        <p id="activeTargetStatus" class="text-[11px] text-slate-400">Notes to yourself: messages, links and files only you can see</p>
                    </div>
                </div>

                <!-- Action Controls & Tabs -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 text-xs border-b-2 border-cyan-400 pb-1 font-semibold text-cyan-400">
                        <button>Chat</button>
                    </div>
                    <div class="flex items-center space-x-2 text-xs text-slate-400 hover:text-white pb-1">
                        <button>Files</button>
                    </div>
                    <div class="h-4 w-px bg-cyan-950"></div>
                    <button onclick="triggerCall('voice')" class="text-slate-300 hover:text-cyan-400 text-sm"><i class="fa-solid fa-phone"></i></button>
                    <button onclick="triggerCall('video')" class="text-slate-300 hover:text-cyan-400 text-sm"><i class="fa-solid fa-video"></i></button>
                </div>
            </header>

            <!-- Message Bubbles Container -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Dynamically populated -->
            </div>

            <!-- Footer Message Input -->
            <footer class="p-4 bg-[#08101a] border-t border-cyan-950/60">
                <form onsubmit="handleSendMessage(event)" class="flex items-center space-x-3">
                    <button type="button" class="text-slate-400 hover:text-cyan-400 text-base"><i class="fa-solid fa-paperclip"></i></button>
                    <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" class="flex-1 py-2.5 px-4 bg-[#050b14] text-xs text-white rounded-xl border border-cyan-900/40 focus:outline-none focus:border-cyan-500">
                    <button type="submit" class="w-9 h-9 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-xl flex items-center justify-center transition shadow-lg shadow-cyan-500/20">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <script>
        // Accounts & Family Contacts Database
        const familyUsers = [
            { id: 'faizan_abbasi', name: 'Muhammad Faizan Abbasi (You)', empId: 'EMP-248929', role: 'Admin', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80' },
            { id: 'nadeem_rizvi', name: 'Nadeem Rizvi', empId: 'EMP-859279', role: 'Family Member', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80' },
            { id: 'mudassir_hussain', name: 'Mudassir Hussain', empId: 'EMP-407953', role: 'Family Member', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80' },
            { id: 'shawal_abbasi', name: 'Shawal Abbasi', empId: 'EMP-304911', role: 'Family Member', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80' }
        ];

        let currentUser = familyUsers[0];
        let activeTargetUser = familyUsers[1];
        let chatData = {};

        function initApp() {
            const saved = localStorage.getItem('echat_2_messages');
            if (saved) {
                try { chatData = JSON.parse(saved); } catch(e) { chatData = {}; }
            }
            renderContactList();
            setActiveTarget(familyUsers[1].id);
        }

        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('loginOverlay').classList.add('hidden');
        }

        function logout() {
            document.getElementById('loginOverlay').classList.remove('hidden');
        }

        function renderContactList(filter = '') {
            const container = document.getElementById('contactList');
            container.innerHTML = '';

            const list = familyUsers.filter(u => u.id !== currentUser.id && u.name.toLowerCase().includes(filter.toLowerCase()));
            list.forEach(u => {
                const isActive = u.id === activeTargetUser.id;
                const html = `
                    <div onclick="setActiveTarget('${u.id}')" class="p-3 flex items-center space-x-3 cursor-pointer hover:bg-cyan-950/30 transition ${isActive ? 'bg-cyan-950/60 border-l-4 border-cyan-400' : ''}">
                        <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover ring-1 ring-cyan-500/30">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center mb-0.5">
                                <h4 class="text-xs font-bold text-white truncate">${u.name}</h4>
                                <span class="text-[10px] text-slate-500">Just now</span>
                            </div>
                            <p class="text-[11px] text-slate-400 truncate">${u.empId}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function filterContacts(val) {
            renderContactList(val);
        }

        function setActiveTarget(id) {
            const target = familyUsers.find(u => u.id === id);
            if (!target) return;
            activeTargetUser = target;
            document.getElementById('activeTargetName').innerText = activeTargetUser.name;
            document.getElementById('activeTargetAvatar').src = activeTargetUser.avatar;
            renderContactList();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const convId = [currentUser.id, activeTargetUser.id].sort().join('___');
            const msgs = chatData[convId] || [];

            if (msgs.length === 0) {
                container.innerHTML = `<div class="h-full flex items-center justify-center text-xs text-slate-500">No messages yet. Send a message to start chatting!</div>`;
                return;
            }

            msgs.forEach(m => {
                const isMe = m.senderId === currentUser.id;
                const html = `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-3">
                        <div class="max-w-md p-3.5 rounded-2xl text-xs ${isMe ? 'bg-cyan-900/80 border border-cyan-500/40 text-white rounded-br-none shadow-lg shadow-cyan-950/50' : 'bg-[#08101a] border border-cyan-950 text-slate-200 rounded-bl-none'}">
                            <p class="leading-relaxed">${m.text}</p>
                            <span class="text-[9px] text-cyan-400/70 block text-right mt-1">${m.time}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const convId = [currentUser.id, activeTargetUser.id].sort().join('___');
            if (!chatData[convId]) chatData[convId] = [];

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            chatData[convId].push({ senderId: currentUser.id, text, time });
            localStorage.setItem('echat_2_messages', JSON.stringify(chatData));

            input.value = '';
            renderMessages();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
